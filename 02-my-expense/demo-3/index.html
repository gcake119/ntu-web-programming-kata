<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>記帳本</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- App Shell -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <button class="icon-btn" id="prevMonthBtn">&#8249;</button>
        <h1 class="month-title" id="monthTitle">2026年 2月</h1>
        <button class="icon-btn" id="nextMonthBtn">&#8250;</button>
      </div>

      <div class="balance-card">
        <p class="balance-label">本月結餘</p>
        <p class="balance-amount" id="balanceAmount">NT$ 0</p>
      </div>

      <div class="summary-row">
        <div class="summary-item income">
          <span class="summary-icon">↑</span>
          <span class="summary-label">收入</span>
          <span class="summary-value" id="totalIncome">NT$ 0</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-item expense">
          <span class="summary-icon">↓</span>
          <span class="summary-label">支出</span>
          <span class="summary-value" id="totalExpense">NT$ 0</span>
        </div>
      </div>
    </header>

    <!-- Transaction List -->
    <main class="main" id="transactionList">
      <!-- Rendered by JS -->
    </main>

    <!-- Empty State -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">📭</div>
      <p>本月尚無紀錄</p>
      <p class="empty-hint">點擊右下角 + 新增第一筆</p>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" id="navList">
        <span class="nav-icon">📋</span>
        <span class="nav-label">明細</span>
      </button>
      <button class="nav-btn" id="navChart">
        <span class="nav-icon">📊</span>
        <span class="nav-label">統計</span>
      </button>
    </nav>

    <!-- FAB -->
    <button class="fab" id="fabBtn" aria-label="新增記帳">
      <span>＋</span>
    </button>
  </div>

  <!-- Chart View (overlay) -->
  <div class="chart-view hidden" id="chartView">
    <div class="chart-header">
      <h2>本月支出分析</h2>
    </div>
    <div class="donut-wrap">
      <svg class="donut-svg" viewBox="0 0 200 200" id="donutSvg"></svg>
      <div class="donut-center" id="donutCenter"></div>
    </div>
    <ul class="legend" id="chartLegend"></ul>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">新增記帳</h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>

      <!-- Type Toggle -->
      <div class="type-toggle">
        <button class="type-btn active" data-type="expense">支出</button>
        <button class="type-btn" data-type="income">收入</button>
      </div>

      <form id="txForm">
        <!-- Amount -->
        <div class="form-group">
          <label>金額</label>
          <div class="amount-input-wrap">
            <span class="currency-prefix">NT$</span>
            <input type="number" id="amountInput" placeholder="0" min="1" required />
          </div>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label>類別</label>
          <div class="category-grid" id="categoryGrid">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label>備註</label>
          <input type="text" id="descInput" placeholder="選填說明" maxlength="30" />
        </div>

        <!-- Date -->
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="dateInput" required />
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">儲存</button>
      </form>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="modal-overlay hidden" id="deleteOverlay">
    <div class="modal confirm-modal">
      <p class="confirm-text">確定要刪除這筆紀錄嗎？</p>
      <div class="confirm-btns">
        <button class="cancel-btn" id="deleteCancelBtn">取消</button>
        <button class="danger-btn" id="deleteConfirmBtn">刪除</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
