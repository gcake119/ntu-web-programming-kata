<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="app-header">
        <h1 class="app-title">✅ My Todo List</h1>

        <!-- Input area -->
        <div class="input-area">
          <div class="input-row">
            <input
              type="text"
              id="todo-input"
              class="todo-input"
              placeholder="新增待辦事項…"
              autocomplete="off"
            />
            <button id="add-btn" class="btn btn--primary">新增</button>
          </div>
          <textarea
            id="desc-input"
            class="desc-input"
            placeholder="描述（選填）"
            rows="2"
          ></textarea>
        </div>

        <!-- Stats bar -->
        <div class="stats-bar">
          <span id="active-count" class="stats-count">0 項待完成</span>
          <button id="clear-completed-btn" class="btn btn--ghost">
            清除已完成
          </button>
        </div>

        <!-- Filter tabs -->
        <div class="filter-tabs" role="tablist">
          <button
            class="filter-tab active"
            data-filter="all"
            role="tab"
            aria-selected="true"
          >
            全部
          </button>
          <button
            class="filter-tab"
            data-filter="active"
            role="tab"
            aria-selected="false"
          >
            待完成
          </button>
          <button
            class="filter-tab"
            data-filter="completed"
            role="tab"
            aria-selected="false"
          >
            已完成
          </button>
        </div>
      </header>

      <!-- Todo list -->
      <main class="todo-scroll">
        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-msg" class="empty-msg" hidden>目前沒有待辦事項 🎉</p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
